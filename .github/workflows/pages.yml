name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Request maximum token permissions; Pages create needs Administration
permissions: write-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try enable Pages via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Attempting to create Pages site (legacy main/)..."
          # Prefer legacy branch deploy (matches requested main/root)
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' || true)
          echo "POST legacy status=$code body=$(cat /tmp/pages.json)"
          if [ "$code" = "409" ] || [ "$code" = "201" ] || [ "$code" = "200" ]; then
            echo "Pages available (legacy)"
            exit 0
          fi
          code2=$(curl -sS -o /tmp/pages2.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true)
          echo "POST workflow status=$code2 body=$(cat /tmp/pages2.json)"
          if [ "$code2" = "409" ] || [ "$code2" = "201" ] || [ "$code2" = "200" ]; then
            echo "Pages available (workflow)"
            exit 0
          fi
          echo "Enable failed; checking GET..."
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages || true
          # Do not fail yet — try Actions deploy path below if workflow build

      - name: Configure Pages
        id: conf
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: steps.conf.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        if: steps.conf.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Verify has_pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }} | tee /tmp/repo.json
          python3 -c 'import json; d=json.load(open("/tmp/repo.json")); print("has_pages=", d.get("has_pages")); raise SystemExit(0 if d.get("has_pages") else 1)'
