<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Moat Watchlist Screen</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --text: #e7ecf3;
    --muted: #8b9bb4;
    --border: #2a3548;
    --accent: #5b9fd4;
    --up: #3dba7e;
    --down: #e06c75;
    --chip: #243044;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.45;
  }
  header {
    padding: 1.25rem 1.5rem 0.75rem; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #162033, var(--bg));
  }
  h1 { margin: 0 0 0.35rem; font-size: 1.25rem; font-weight: 650; }
  .meta { color: var(--muted); font-size: 0.875rem; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
    padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .toolbar label { font-size: 0.8rem; color: var(--muted); }
  input[type="search"], select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.45rem 0.7rem; font-size: 0.9rem;
  }
  input[type="search"] { min-width: 12rem; }
  .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  button.chip {
    background: var(--chip); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.35rem 0.75rem; cursor: pointer; font-size: 0.85rem;
  }
  button.chip.active { border-color: var(--accent); color: #cfe6f8; background: #1e3a55; }
  .wrap { overflow: auto; padding: 0 0 2rem; max-height: calc(100vh - 9rem); }
  table {
    width: 100%; border-collapse: collapse; font-size: 0.875rem;
    min-width: 960px;
  }
  th, td { padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th {
    position: sticky; top: 0; background: #152033; z-index: 2;
    cursor: pointer; user-select: none; color: #c5d0e0; font-weight: 600;
  }
  th:hover { color: #fff; }
  th .arrow { opacity: 0.35; margin-left: 0.25rem; font-size: 0.75rem; }
  th.sorted .arrow { opacity: 1; color: var(--accent); }
  td.num { font-variant-numeric: tabular-nums; text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  th.num { text-align: right; }
  tr:hover td { background: rgba(91,159,212,0.08); }
  .pill {
    display: inline-block; padding: 0.12rem 0.5rem; border-radius: 999px;
    font-size: 0.75rem; background: var(--chip); border: 1px solid var(--border);
  }
  .pill.core { color: #9fd0ff; }
  .pill.sat { color: #ffc89a; }
  .pos { color: var(--up); }
  .neg { color: var(--down); }
  .hint { padding: 0.6rem 1.5rem; color: var(--muted); font-size: 0.8rem; }
  footer { padding: 0.75rem 1.5rem 1.5rem; color: var(--muted); font-size: 0.75rem; }
</style>
</head>
<body>
<header>
  <h1>護城河名單 · 可排序畫面</h1>
  <div class="meta">資料截至 2026-09-23 收盤 · Yahoo Finance · 點欄位標題排序 · 固定名單（不自行加股）</div>
</header>
<div class="toolbar">
  <div>
    <label>搜尋</label><br/>
    <input id="q" type="search" placeholder="Ticker 或公司名" />
  </div>
  <div>
    <label>分組</label><br/>
    <div class="chips" id="groupChips">
      <button type="button" class="chip active" data-group="全部">全部</button>
      <button type="button" class="chip" data-group="主倉">主倉</button>
      <button type="button" class="chip" data-group="衛星">衛星</button>
    </div>
  </div>
  <div>
    <label>快捷篩選</label><br/>
    <div class="chips" id="quickChips">
      <button type="button" class="chip" data-quick="">清除</button>
      <button type="button" class="chip" data-quick="below200">低於 200MA</button>
      <button type="button" class="chip" data-quick="above200">高於 200MA</button>
      <button type="button" class="chip" data-quick="rsi40">RSI &lt; 40</button>
      <button type="button" class="chip" data-quick="fade5">5Y 弱於 10Y ≥5pp</button>
    </div>
  </div>
</div>
<div class="hint">依你的規則：畫面不是買賣建議；衛星歷史報酬不能當主倉預期；RSI 不作賣出系統。</div>
<div class="wrap">
<table id="tbl">
  <thead>
    <tr>
      <th data-key="ticker">Ticker <span class="arrow">↕</span></th>
      <th data-key="name">公司 <span class="arrow">↕</span></th>
      <th data-key="group">分組 <span class="arrow">↕</span></th>
      <th class="num" data-key="price">價格 <span class="arrow">↕</span></th>
      <th class="num" data-key="rsi">RSI(14) <span class="arrow">↕</span></th>
      <th class="num" data-key="sma200">200日SMA <span class="arrow">↕</span></th>
      <th class="num" data-key="gap">距200MA% <span class="arrow">↕</span></th>
      <th class="num" data-key="cagr5">5Y CAGR% <span class="arrow">↕</span></th>
      <th class="num" data-key="cagr10">10Y CAGR% <span class="arrow">↕</span></th>
      <th class="num" data-key="spread">5Y−10Y pp <span class="arrow">↕</span></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</div>
<footer>來源：Yahoo Finance · 固定觀察名單（不含持倉）</footer>

let sortKey = 'gap';
let sortAsc = true;
let groupFilter = '全部';
let quick = '';
let query = '';

const tbody = document.querySelector('#tbl tbody');
const qInput = document.getElementById('q');

function fmtPct(n, digits=1) {
  const s = (n >= 0 ? '+' : '') + n.toFixed(digits) + '%';
  return s;
}
function clsPct(n) { return n >= 0 ? 'pos' : 'neg'; }

function filtered() {
  return DATA.filter(d => {
    if (groupFilter !== '全部' && d.group !== groupFilter) return false;
    if (quick === 'below200' && !(d.gap < 0)) return false;
    if (quick === 'above200' && !(d.gap > 0)) return false;
    if (quick === 'rsi40' && !(d.rsi < 40)) return false;
    if (quick === 'fade5' && !((d.cagr10 - d.cagr5) >= 5)) return false;
    if (query) {
      const q = query.toLowerCase();
      if (!(d.ticker.toLowerCase().includes(q) || d.name.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function render() {
  const rows = filtered().slice().sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') {
      av = av.toLowerCase(); bv = bv.toLowerCase();
      if (av < bv) return sortAsc ? -1 : 1;
      if (av > bv) return sortAsc ? 1 : -1;
      return 0;
    }
    return sortAsc ? av - bv : bv - av;
  });
  tbody.innerHTML = rows.map(d => `
    <tr>
      <td><strong>${d.ticker}</strong></td>
      <td title="${d.name}">${d.name}</td>
      <td><span class="pill ${d.group === '主倉' ? 'core' : 'sat'}">${d.group}</span></td>
      <td class="num">${d.price.toFixed(2)}</td>
      <td class="num">${d.rsi.toFixed(1)}</td>
      <td class="num">${d.sma200.toFixed(2)}</td>
      <td class="num ${clsPct(d.gap)}">${fmtPct(d.gap)}</td>
      <td class="num ${clsPct(d.cagr5)}">${fmtPct(d.cagr5)}</td>
      <td class="num ${clsPct(d.cagr10)}">${fmtPct(d.cagr10)}</td>
      <td class="num ${clsPct(d.spread)}">${fmtPct(d.spread)}</td>
    </tr>`).join('');
  document.querySelectorAll('th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === sortKey);
    const arrow = th.querySelector('.arrow');
    if (arrow) arrow.textContent = th.dataset.key === sortKey ? (sortAsc ? '↑' : '↓') : '↕';
  });
}

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = (key === 'ticker' || key === 'name' || key === 'group'); }
    render();
  });
});

document.querySelectorAll('#groupChips .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#groupChips .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    groupFilter = btn.dataset.group;
    render();
  });
});

document.querySelectorAll('#quickChips .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#quickChips .chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    quick = btn.dataset.quick;
    render();
  });
});

qInput.addEventListener('input', () => { query = qInput.value.trim(); render(); });

render();
</script>
</body>
</html>
